# Claude Dependabot PR Review Workflow
#
# Analyzes a Dependabot PR's dependency changes, looks up changelogs, checks
# for breaking changes and docs-build impact, and posts a single review
# comment with a recommendation (APPROVE / REVIEW_NEEDED / HOLD).
#
# Triggered on: Dependabot PRs (opened, synchronize) — job only runs when the
# PR author is dependabot[bot]; or workflow_dispatch with a required
# pr_number input (manual run, e.g. for testing)
# Requirements: ANTHROPIC_API_KEY secret must be configured
#
# Notes:
# - Uses the default GITHUB_TOKEN, not the ocs-agent app token.
# - No concurrency group, so overlapping runs on the same PR are not
#   cancelled or queued.
# - WebFetch/WebSearch are kept in --allowedTools for changelog lookups;
#   Keep the rest of the tool list minimal rather than widening it.
# - The "Resolve PR ref" step fails unless the PR author is Dependabot, so a
#   manual run cannot build or review an arbitrary PR's code.
# - The prompt lives in .github/templates/dependabot-review-prompt.md and is
#   rendered with envsubst (PR_NUMBER and REPO only), read from the default branch.

name: Claude Dependabot PR Review

on:
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to analyze'
        required: true
        type: string

# Restrict default permissions — job overrides as needed
permissions: {}

jobs:
  dependabot-review:
    # Only run on Dependabot PRs, or manual dispatch for testing
    if: github.actor == 'dependabot[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      pull-requests: write
      id-token: write  # Needed for Claude Code Action

    steps:
      - name: Resolve PR ref
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # workflow_dispatch input is free text; gh would also accept a branch name or URL
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "pr_number must be a number, got: $PR_NUMBER" >&2
            exit 1
          fi
          AUTHOR=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json author --jq '.author.login')
          # gh reports the bot login without the [bot] suffix
          if [ "$AUTHOR" != "app/dependabot" ] && [ "$AUTHOR" != "dependabot[bot]" ]; then
            echo "PR #$PR_NUMBER is authored by $AUTHOR, not Dependabot; refusing to run." >&2
            exit 1
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          REF=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefName --jq '.headRefName')
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      # The prompt template comes from the default branch, not the PR branch, so a PR
      # cannot change the instructions Claude receives. This must come after the root
      # checkout, which would otherwise delete the trusted/ directory.
      - name: Checkout prompt template
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          sparse-checkout: .github/templates
          persist-credentials: false

      # Render the prompt before any PR code runs (uv sync can execute package build
      # hooks), so nothing from the PR can modify the template first. The step output
      # is fixed once written.
      - name: Build review prompt
        id: build_prompt
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          REPO: ${{ github.repository }}
        run: |
          # Restrict substitution to these variables so other $ in the template stay literal
          # Random delimiter so a template line of "EOF" cannot end the output early
          DELIMITER="EOF_$(openssl rand -hex 16)"
          {
            echo "instructions<<$DELIMITER"
            envsubst '${PR_NUMBER} ${REPO}' < trusted/.github/templates/dependabot-review-prompt.md
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --locked

      - name: Run Claude Dependabot Analysis
        id: claude_review
        uses: anthropics/claude-code-action@v1.0.248
        timeout-minutes: 10
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: "dependabot[bot]"
          claude_args: |
            --max-turns 70
            --allowedTools "Bash(uv sync --locked),Bash(uv run zensical build --clean),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),WebFetch(domain:github.com,domain:raw.githubusercontent.com,domain:pypi.org),WebSearch"
          prompt: ${{ steps.build_prompt.outputs.instructions }}
