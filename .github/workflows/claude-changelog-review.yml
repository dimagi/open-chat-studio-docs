# Changelog PR Review Workflow
#
# Reviews the "Changelog + Docs" PRs that update-changelog.yml opens. Claude
# writes those PRs from OCS PR text, so this is a second, read-only check on
# them. Posts comments only: a top-level summary plus inline comments.
#
# Triggered on: pull_request (opened, reopened, ready_for_review) — runs only
# when the PR is authored by the ocs-agent app, comes from a `changelog-pr-*`
# branch in this repo, and has "Changelog + Docs" in its title - this includes
# "[Widget] Changelog + Docs:".
# update-api-docs PRs and "Changelog:"-only PRs do not match.
# Requirements: ANTHROPIC_API_KEY secret
#
# Notes:
# - allowed_bots lists only ocs-agent[bot]; never '*'.
# - Tools are read and comment only: no WebFetch, no `uv run`, no build or lint.
#   Nothing from the PR is executed.
# - Uses the job's GITHUB_TOKEN (github_token below), so the `permissions:`
#   block is the ceiling for what the job can do.
# - Grouped by PR number (`cancel-in-progress: true`), so a new trigger on
#   the same PR cancels a run already in progress.
# - Not triggered on `synchronize`, same as claude-review.yml.

name: Changelog PR Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Restrict default permissions — job overrides as needed
permissions: {}

jobs:
  review:
    if: >-
      github.event.pull_request.user.login == 'ocs-agent[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'changelog-pr-') &&
      contains(github.event.pull_request.title, 'Changelog + Docs')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # Checkout only
      pull-requests: write # Post review comments
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Changelog and User Docs PR Review
        uses: anthropics/claude-code-action@v1.0.245
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          allowed_bots: "ocs-agent[bot]"
          prompt: "/review-changelog-pr REPO: ${{ github.repository }} PR_NUMBER: ${{ github.event.pull_request.number }}"
          claude_args: |
            --max-turns 25
            --allowedTools "Task,
            Read,
            Grep,
            Glob,
            mcp__github_inline_comment__create_inline_comment,
            Bash(gh pr comment:*),
            Bash(gh pr diff:*),
            Bash(gh pr view:*)"
