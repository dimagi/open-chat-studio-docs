# PR Review Workflow
#
# Runs the documentation-pr-reviewer subagent (via /review-pr) against a PR's
# diff and posts feedback as PR comments — a top-level summary plus inline
# comments on specific files/lines.
#
# Triggered on: pull_request (opened, ready_for_review, reopened) — skips
# Dependabot PRs and PRs labelled `automated`
# Requirements: ANTHROPIC_API_KEY secret must be configured
#
# Notes:
# - Grouped by PR number (`cancel-in-progress: true`), so a new trigger on
#   the same PR cancels a run already in progress.
# - Not triggered on `synchronize` — pushing new commits to an open PR does
#   not start a new review or cancel one already running.
#
# Security Notes:
# - The claude-code-action's has a built-in check that the triggering user has write
#   access to this repo. For anyone without write access (most fork PR authors
#   included) the "PR Review" step, will fail with error:
#   User does not have write access on this repository" rather than being
#   silently skipped

name: PR Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Restrict default permissions — job overrides as needed
permissions: {}

jobs:
  review:
    if: ${{ github.actor != 'dependabot[bot]' && !contains(github.event.pull_request.labels.*.name, 'automated') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: PR Review with Progress Tracking
        uses: anthropics/claude-code-action@v1.0.206
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/review-pr REPO: ${{ github.repository }} PR_NUMBER: ${{ github.event.pull_request.number }}"
          claude_args: |
            --allowedTools "Task,Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
