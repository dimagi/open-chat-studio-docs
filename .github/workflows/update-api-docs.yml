# Update API Documentation Workflow
#
# Regenerates docs/api/ from the OCS OpenAPI schema — fetches the schema files
# from the OCS repo, runs them through src/ocs_docs/openapi_to_docs.py, and opens
# a PR with the result if anything changed. docs/api/ is generated; don't hand-edit.
#
# Triggered on: repository_dispatch (`ocs_api_update`) from the OCS repo; a daily
# schedule (02:00 UTC) as a backstop; or workflow_dispatch (manual)
# Requirements: OCS_AGENT_APP_ID (var) / OCS_AGENT_PRIVATE_KEY (secret) for the
# ocs-agent GitHub App token used to open the PR
#
# Notes:
# - Labelled `automated`, same as update-changelog.yml's PRs — keeps these PRs
#   out of the AI review in claude-review.yml (see README-claude-workflows.md).

name: Update API Documentation

on:
  repository_dispatch:
    types: [ ocs_api_update ]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:  # Allow manual trigger

# Restrict default permissions — job overrides as needed
permissions: {}

jobs:
  update-docs:
    runs-on: ubuntu-latest

    permissions:
      contents: read  # read permission for checkout — PR creation uses the ocs-agent app token, not this

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Fetch OpenAPI schema directory
        env:
          # Path to the per-version schema directory in the OCS repo.
          API_SCHEMA_DIR: api-schemas
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p schemas
          gh api "repos/dimagi/open-chat-studio/contents/${API_SCHEMA_DIR}?ref=main" \
            --jq '.[] | select(.name | test("\\.ya?ml$")) | .download_url' \
          | while read -r url; do
              echo "Downloading $url"
              curl -fsSL "$url" -O --output-dir schemas
            done
          echo "Fetched schema files:"
          ls -1 schemas

      - name: Generate API documentation
        run: uv run python src/ocs_docs/openapi_to_docs.py schemas -o docs/api/

      - name: Apply lint rules
        run: |
          # Auto-fix lint issues (markdownlint, trailing whitespace, EOF) on the
          # generated docs so committed output matches local pre-commit. prek hooks
          # exit non-zero when they modify files; that's expected here, so don't fail.
          uv run prek run --files $(find docs/api -name '*.md') || true

      - name: Check for changes
        id: check_changes
        run: |
          # --porcelain catches untracked files too, so a brand-new version
          # directory (e.g. docs/api/v2/) is detected, not just edits to tracked files.
          if [ -z "$(git status --porcelain docs/api/)" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate app token
        if: steps.check_changes.outputs.has_changes == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.OCS_AGENT_APP_ID }}
          private-key: ${{ secrets.OCS_AGENT_PRIVATE_KEY }}

      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "update API documentation from OpenAPI schema"
          title: "Update API Documentation"
          body: |
            ## Summary
            - Automated update of API documentation from OpenAPI schema
          branch: update-api-docs-${{ github.run_number }}
          delete-branch: true
          assignees: snopoke
          team-reviewers: dimagi/open-chat-studio
          labels: automated
