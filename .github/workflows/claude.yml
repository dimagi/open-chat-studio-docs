# Claude Code Workflow
#
# Runs Claude Code against issues and PR/issue conversations.

# Triggered on: `@claude` mention in an issue comment, PR review comment, or
# PR review; or an issue opened/assigned with `@claude` in the title or body
# Requirements: ANTHROPIC_API_KEY secret, and OCS_AGENT_APP_ID (var) /
# OCS_AGENT_PRIVATE_KEY (secret) for the ocs-agent GitHub App token
#
# Notes:
# - No concurrency group is set, so overlapping triggers on the same
#   issue/PR run in parallel rather than queuing or cancelling each other.
# - The job-level `if:` is a cheap substring pre-filter (Actions expression
#   syntax has no regex), so the job doesn't get dispatched at all for the
#   common case of a comment/issue that never mentions `@claude`. The "Check
#   for a real @claude mention" step then does a precise word-boundary regex
#   match (via grep -P) so things like `foo@claude.ai` or `@claude-bot` don't
#   fall through to checkout/build/Claude invocation — remaining steps are
#   gated on its output.
# - claude-code-action picks its own push target from context (existing
#   branch for an open PR, a new branch for issues/closed PRs) — independent
#   of the ref this workflow's own Checkout repository step resolves.
#
# Security Notes:
# - Untrusted comment/issue text is passed in via `env:`,
#   never interpolated directly into the `run:` script.
# - The `claude` job has no actor/permission gate of its own — it relies on
#   claude-code-action's built-in check that the triggering user has write
#   access to this repo. A mention or review from anyone without write
#   access (most fork PR authors included) fails the "Run Claude Code" step
#   with "Action failed with error: User does not have write access on this
#   repository" rather than being silently skipped.

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Restrict default permissions — job overrides as needed
permissions: {}

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Needed for Claude Code Action
      # NOTE:no step consumes the default GITHUB_TOKEN, using the ocs-agent app token

    steps:
      - name: Check for a real @claude mention
        id: check
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          REVIEW_BODY: ${{ github.event.review.body }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          text="$COMMENT_BODY"$'\n'"$REVIEW_BODY"$'\n'"$ISSUE_BODY"$'\n'"$ISSUE_TITLE"
          if grep -Piq '(?<!\w)@claude(?![\w-])' <<< "$text"; then
            echo "triggered=true" >> "$GITHUB_OUTPUT"
          else
            echo "triggered=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate app token
        id: app-token
        if: steps.check.outputs.triggered == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.OCS_AGENT_APP_ID }}
          private-key: ${{ secrets.OCS_AGENT_PRIVATE_KEY }}

      - name: Checkout repository
        if: steps.check.outputs.triggered == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Install uv
        if: steps.check.outputs.triggered == 'true'
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        if: steps.check.outputs.triggered == 'true'
        run: uv sync --locked

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1.0.206
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr create:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(uv run zensical build:*),Bash(uv run zensical serve:*),Bash(uv sync --locked),Bash(uv run pytest:*),Read,Write,Edit"
