# Claude Code Workflow
#
# Runs Claude Code against issues and PR/issue conversations.

# Triggered on: `@claude` mention in an issue comment, PR review comment, or
# PR review; or an issue opened/assigned with `@claude` in the title or body
# Requirements: ANTHROPIC_API_KEY secret, and OCS_AGENT_APP_ID (var) /
# OCS_AGENT_PRIVATE_KEY (secret) for the ocs-agent GitHub App token
#
# Notes:
# - No concurrency group is set, so overlapping triggers on the same
#   issue/PR run in parallel rather than queuing or cancelling each other.
# - claude-code-action picks its own push target from context (existing
#   branch for an open PR, a new branch for issues/closed PRs) — independent
#   of the ref the "Resolve checkout ref" step resolves.
#
# Security Notes:
# - The `claude` job has no actor/permission gate of its own — it relies on
#   claude-code-action's built-in check that the triggering user has write
#   access to this repo, failing the "Run Claude Code" step loudly (not
#   silently skipping) for anyone else.

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Restrict default permissions — job overrides as needed
permissions: {}

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Needed for Claude Code Action
      # No step consumes the default GITHUB_TOKEN — checkout and
      # claude-code-action both use the ocs-agent app token instead.

    steps:
      - name: Check for a real @claude mention
        id: check
        # Untrusted comment/issue text goes through env:, never interpolated
        # directly into the script below, to avoid shell injection.
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          REVIEW_BODY: ${{ github.event.review.body }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          text="$COMMENT_BODY"$'\n'"$REVIEW_BODY"$'\n'"$ISSUE_BODY"$'\n'"$ISSUE_TITLE"
          if grep -Piq '(?<!\w)@claude(?![\w-])' <<< "$text"; then
            echo "triggered=true" >> "$GITHUB_OUTPUT"
          else
            echo "triggered=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate app token
        id: app-token
        if: steps.check.outputs.triggered == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.OCS_AGENT_APP_ID }}
          private-key: ${{ secrets.OCS_AGENT_PRIVATE_KEY }}

      - name: Resolve checkout ref
        id: resolve-ref
        if: steps.check.outputs.triggered == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          ISSUE_PR_URL: ${{ github.event.issue.pull_request.url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DEFAULT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ -n "$PR_HEAD_REF" ]; then
            # pull_request_review / pull_request_review_comment: head ref is in the payload
            ref="$PR_HEAD_REF"
          elif [ -n "$ISSUE_PR_URL" ]; then
            # issue_comment on a PR: payload has no head ref, so look it up
            ref=$(gh api "repos/${{ github.repository }}/pulls/$ISSUE_NUMBER" --jq .head.ref)
          else
            # issues event, or issue_comment on a plain issue: no PR branch involved
            ref="$DEFAULT_REF"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.check.outputs.triggered == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.resolve-ref.outputs.ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Install uv
        if: steps.check.outputs.triggered == 'true'
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        if: steps.check.outputs.triggered == 'true'
        run: uv sync --locked

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1.0.206
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app-token.outputs.token }}
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr create:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(uv run zensical build:*),Bash(uv run zensical serve:*),Bash(uv sync --locked),Bash(uv run pytest:*),Read,Write,Edit"
