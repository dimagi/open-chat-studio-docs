default_language_version:
  python: python3.13
repos:
  # ---------------------------------------------------------------------------
  # File hygiene
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Preserve intentional two-space line-breaks in Markdown
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        # --unsafe is required for mkdocs.yml which uses !!python/name: tags
        args: [--unsafe]
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: fix-byte-order-marker
      - id: check-merge-conflict
      - id: no-commit-to-branch
        args: [--branch, main, --branch, widget-develop]

  # ---------------------------------------------------------------------------
  # GitHub Actions workflow validation
  # ---------------------------------------------------------------------------
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # ---------------------------------------------------------------------------
  # Markdown quality
  # ---------------------------------------------------------------------------
  # cli2 (not classic markdownlint-cli): config is auto-discovered and cascades
  # per directory — do not pass --config, it would disable the cascade.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2

  # ---------------------------------------------------------------------------
  # Detects secrets in git repositories, including passwords, API keys, and tokens
  # ---------------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
