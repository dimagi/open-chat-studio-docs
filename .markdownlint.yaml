default: true

# All rules are on by default; the ones below are disabled because they don't fit this
# project's style, or tuned. Rules that stay enabled are the ones that matter most for
# AI agent parsing, structural integrity, and link/reference correctness (MD041, MD051, MD059).

# List markers can be either - or *
MD004: false

# Ignore unordered list indentation check
MD007: false

# Line length — reduce progressively after long lines are fixed
MD013:
  line_length: 750
  code_blocks: false
  tables: false
  headings: false

# Ignore need for blank lines around headings
MD022: false

MD024:
  siblings_only: true

# Only one H1 per page (frontmatter title doesn't count, so a real H1 isn't a duplicate)
MD025:
  front_matter_title: ""

MD026: false
MD029:
  style: ordered
MD030: false

# Ignore need for blank lines around lists
MD032: false

# Inline HTML: MkDocs Material uses <br>, <kbd>, attribute lists, etc.
MD033:
  allowed_elements:
    - a
    - br
    - details
    - div
    - figcaption
    - figure
    - iframe
    - kbd
    - small
    - span
    - sub
    - summary
    - sup

MD034: false

# Both are enabled by `default: true`; listed explicitly so the intent survives future edits.
MD038: true   # no stray spaces inside inline code spans
MD040: true   # every fenced block declares a language (see .markdownlint-prompts.yaml
              # for the restricted vocabulary applied to prompt files)

# Every page must open with an H1 (frontmatter title does not substitute)
MD041:
  front_matter_title: ""

MD046: false
MD050: false

# Keep this rule. Link-fragment validation to catch broken in-document links after heading changes.
# Scope: same-document fragments only — cross-file `foo.md#anchor` links are not checked.
MD051: true

MD053: false
MD054: false
MD058: false

# Keep this rule. Require descriptive link text (no "click here") — agents extracting a link
# out of context need the anchor text itself to say what it points to.
MD059: true

MD060: false
